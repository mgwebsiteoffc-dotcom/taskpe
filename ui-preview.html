<!doctype html>
<!--
  Design preview — NOT part of the app. Open this file in a browser to see the real
  UI (public/js/app.js + public/css/app.css, untouched) against a fake store, so the
  look can be judged without deploying anything. It is at the repo root on purpose:
  only files in public/ are served, so this never reaches a merchant.

  What it fakes: window.shopify (a session token) and fetch (/api/board, /api/settings,
  /api/resources/search). Add ?boot=1200 to the URL to see the loading screens.
  ?billing=shopify (default) shows the Plan tab quoting Shopify; ?billing=api shows the
  legacy in-app price table; ?billing=free drops the store to Free to read that banner.
  Everything rendered is the shipping code: same app.js, same app.css. Click
  Board / List / Month, tap a stat tile to filter, press ? for the shortcut list.
  If something here looks different from the deployed app, the preview is lying and
  should be fixed — it is only useful while the two are identical.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskPe — design preview (fake data)</title>
<link rel="stylesheet" href="public/css/app.css">
</head>
<body>
<div id="root"></div>
<script>
  window.__TASKPE__ = { appUrl: '', shop: 'demo-store.myshopify.com', host: '', embedded: true, view: 'board' };
  window.shopify = { idToken: async () => 'a.b.c' };

  const params = new URLSearchParams(location.search);
  // Who owns the price, for the Plan tab and the Free banner. Shopify's mode carries no
  // `prices` at all — the payload really has no number to lie with — and the amount in the
  // "What Shopify bills you" panel is the subscription's own, currency and all.
  const BILLING_MODE = params.get('billing') === 'api' ? 'api' : 'shopify';
  const ON_FREE = params.get('billing') === 'free';

  const iso = days => new Date(Date.now() - days * 864e5).toISOString();
  const todayAt = (h) => { const d = new Date(); d.setHours(h, 0, 0, 0); return d.toISOString(); };

  const task = (id, title, extra) => ({
    id, title, description: null, priority: 'medium', due_at: null, overdue: false,
    position: 0, completed_at: null, created_at: iso(3), created_by: 'Priya Sharma',
    assignee: null, resource: null, checklist: null, ...extra,
  });

  const board = {
    shop: {
      domain: 'demo-store.myshopify.com', name: 'House of Indha', plan: ON_FREE ? 'free' : 'starter',
      plan_cfg: { task_limit: 50, whatsapp: true, digest: true },
      timezone: 'Asia/Kolkata', currency: 'INR', onboarded: true,
    },
    billing: {
      mode: BILLING_MODE,
      plans_url: '',
      shopify: ON_FREE || BILLING_MODE === 'api'
        ? { available: true, subscribed: false }
        : { available: true, subscribed: true, name: 'TaskPe Starter', amount: '499.00', currency: 'INR',
            interval: 'EVERY_30_DAYS', renews_at: iso(-30), trial_days: 7, test: false },
    },
    plans: BILLING_MODE === 'api'
      ? { free: { name: 'Free', prices: {} },
          starter: { name: 'Starter', prices: { USD: 5.99, INR: 499 }, trial_days: 7 },
          growth: { name: 'Growth', prices: { USD: 11.99, INR: 999 }, trial_days: 7 } }
      : { free: { name: 'Free' }, starter: { name: 'Starter', trial_days: 7 }, growth: { name: 'Growth', trial_days: 7 } },
    task_templates: {
      cod_confirm: { icon: 'phone', name: 'COD confirmation', tagline: 'Verify before ship',
        resource_type: 'order', priority: 'high', due_in_hours: 24,
        title: 'Confirm COD order {order}', checklist: ['Call buyer', 'Confirm address'] },
    },
    members: [
      { id: 1, name: 'Priya Sharma', initials: 'PS', phone: '919876500001', role: 'owner', active: true, whatsapp_verified: true, portal_active: true },
      { id: 2, name: 'Rahul Kumar', initials: 'RK', phone: '919876500002', role: 'teammate', active: true, whatsapp_verified: true, portal_active: true },
      { id: 3, name: 'Imran Sheikh', initials: 'IS', phone: '919876500003', role: 'teammate', active: true, whatsapp_verified: false, portal_active: true },
      { id: 4, name: 'Neha Gupta', initials: 'NG', phone: '919876500004', role: 'teammate', active: false, whatsapp_verified: false, portal_active: false },
    ],
    teams: ['Accounting', 'Warehouse'],
    me: 1,
    whatsapp: { plan_allowed: true, master_on: true, has_key: true, enabled: true },
    columns: [
      { id: 1, name: 'COD confirmations', position: 0, team: 'Accounting', is_done_stage: false, tasks: [
        task(21, 'Call the buyer about the failed payment', { priority: 'urgent', overdue: true, due_at: iso(2), created_at: iso(6), assignee: { id: 2, name: 'Rahul Kumar', initials: 'RK' }, resource: { type: 'order', id: null, label: 'Order', title: '#101', url: '#', verified: false } }),
        task(22, 'Verify the UPI screenshot before dispatch', { priority: 'high', due_at: todayAt(18), created_at: iso(1), assignee: { id: 1, name: 'Priya Sharma', initials: 'PS' }, description: '- [x] Open the screenshot\n- [ ] Match the UTR number\n- [ ] Note it on the order' }),
        task(23, 'Release the payment hold on 3 orders', { priority: 'medium', created_at: iso(4), assignee: { id: 2, name: 'Rahul Kumar', initials: 'RK' } }),
      ] },
      { id: 2, name: 'Dispatch', position: 1, team: 'Warehouse', is_done_stage: false, tasks: [
        task(24, 'Split the bulk order into two shipments', { priority: 'high', overdue: true, due_at: iso(1), created_at: iso(5), assignee: { id: 3, name: 'Imran Sheikh', initials: 'IS' } }),
        task(25, 'Weigh the courier bag and update labels', { priority: 'low', created_at: iso(0), due_at: todayAt(11) }),
        task(26, 'Pack the return from last week', { priority: 'medium', created_at: iso(2), assignee: { id: 3, name: 'Imran Sheikh', initials: 'IS' } }),
      ] },
      { id: 3, name: 'Escalations', position: 2, team: null, is_done_stage: false, tasks: [
        task(31, 'Chase the courier for the lost parcel', { priority: 'urgent', overdue: true, due_at: iso(7), created_at: iso(11) }),
      ] },
      { id: 4, name: 'Done this week', position: 3, team: 'Warehouse', is_done_stage: true, tasks: [
        task(41, 'Refunded the shipping on 4 orders', { completed_at: iso(0), due_at: iso(1), created_at: iso(3), assignee: { id: 1, name: 'Priya Sharma', initials: 'PS' }, priority: 'medium' }),
        task(42, 'Reconciled the COD cash', { completed_at: iso(1), due_at: iso(2), created_at: iso(4), assignee: { id: 2, name: 'Rahul Kumar', initials: 'RK' }, priority: 'high' }),
        task(43, 'Answered the 1-star review', { completed_at: iso(2), due_at: iso(3), created_at: iso(5), assignee: { id: 2, name: 'Rahul Kumar', initials: 'RK' }, priority: 'low' }),
        task(44, 'Archived the export', { completed_at: iso(4), created_at: iso(6), assignee: { id: 3, name: 'Imran Sheikh', initials: 'IS' } }),
        task(45, 'Restocked the display pieces', { completed_at: iso(6), created_at: iso(8), assignee: { id: 3, name: 'Imran Sheikh', initials: 'IS' } }),
      ] },
    ],
  };

  const settings = {
    whatify: { connected: true },
    settings: {
      has_api_key: true, api_key_hint: 'what_•••4f2', whatsapp_account_id: 'wa-1',
      templates: {}, notify: { whatsapp_on: true, on_assign: true },
      digest: { enabled: true, time: '09:00' },
      automation: { cod_auto: true, ndr_auto: false, weekly_remittance: true },
      ndr_intake_url: null,
    },
    plan: { name: 'Starter', cfg: { whatsapp: true, digest: true, task_limit: 50 } },
    logs: [],
  };

  const mutateTeams = async (body) => {
    const name = String(body.name || '').trim();
    const at = board.teams.findIndex(t => t.toLowerCase() === name.toLowerCase());
    if (body.method === 'POST') {
      if (at > -1) throw new Error('"' + name + '" is already one of your teams.');
      board.teams.push(name);
    } else if (body.method === 'PATCH') {
      const from = decodeURIComponent(body.__from);
      const i = board.teams.findIndex(t => t.toLowerCase() === from.toLowerCase());
      if (i < 0) throw new Error('No team called ' + from + '.');
      board.teams[i] = name;
      for (const c of board.columns) if ((c.team || '').toLowerCase() === from.toLowerCase()) c.team = name;
    } else {
      const from = decodeURIComponent(body.__from);
      const used = board.columns.filter(c => (c.team || '').toLowerCase() === from.toLowerCase()).length;
      if (used) throw new Error(used + ' column' + (used === 1 ? '' : 's') + ' still use ' + from + '. Edit those columns first.');
      board.teams = board.teams.filter(t => t.toLowerCase() !== from.toLowerCase());
    }
    board.teams.sort((a, b) => a.localeCompare(b));
    return { ok: true };
  };

  const payload = {
    '/api/board': board,
    // A resource search that answers, so the picker can be looked at too. The note is
    // the real one an unapproved store sees, and it is worth judging how it reads.
    '/api/resources/search': { items: [
      { type: 'order', id: 1042, title: '#1042', subtitle: '\u20b91,299.00 INR \u00b7 paid', url: '#' },
      { type: 'order', id: 1043, title: '#1043', subtitle: '\u20b94,850.00 INR \u00b7 pending', url: '#' },
    ], note: 'Shopify only lets this app read orders created since TaskPe was installed (2026-09-01), so anything older than that cannot appear here.' },
    '/api/settings': settings,
    // The shape the drawer actually reads (`GET /api/tasks/{id}/activity`), so the
    // activity timeline and the hand-typed link can be judged here rather than only on a
    // live store: task 21 is deliberately an UNVERIFIED link (id null, verified false).
    '/api/tasks/21/activity': [
      { action: 'created', actor_name: 'Priya Sharma', created_at: iso(6), meta: { column: 'To Do' } },
      { action: 'assigned', actor_name: 'Priya Sharma', created_at: iso(5), meta: { to: 'Rahul Kumar' } },
      { action: 'linked', actor_name: 'Priya Sharma', created_at: iso(2),
        meta: { manual: '101', note: 'this app may only read orders created since 2026-09-01, so nobody checked the number against Shopify' } },
    ],
  };

  window.fetch = async (url, init) => {
    const path = String(url).split('?')[0];
    if (path === '/api/teams' || path.startsWith('/api/teams/')) {
      const json = JSON.parse(init.body || '{}');
      try {
        await mutateTeams({ ...json, method: init.method, __from: path.split('/').pop() });
        return { ok: true, status: 201, json: async () => ({ ok: true, teams: board.teams }) };
      } catch (e) {
        return { ok: false, status: 422, json: async () => ({ message: e.message }) };
      }
    }
    // Column tags flow back into the team list, as they do on the server.
    if (path.startsWith('/api/columns/') && init.method === 'PATCH') {
      const json = JSON.parse(init.body || '{}');
      const col = board.columns.find(c => String(c.id) === path.split('/').pop());
      if (col) col.team = json.team || null;
      const t = (json.team || '').trim();
      if (t && !board.teams.some(x => x.toLowerCase() === t.toLowerCase())) board.teams.push(t);
      board.teams.sort((a, b) => a.localeCompare(b));
    }
    const body = payload[path] ?? (path.includes('/complete') || path.includes('/tasks') ? { ok: true } : { items: [] });
    await new Promise(r => setTimeout(r, latency));    // let the loading states be seen
    return { ok: true, status: 200, json: async () => body };
  };
  // ?boot=<ms> holds every fake reply open, so the waiting screens can be reviewed in
  // the same file as the board they come before: ?boot=1200 for the skeleton, ?boot=9000
  // to watch the "still waiting?" line appear at eight seconds. The blade renders the
  // identical markup before app.js exists, so what you see here is what the merchant sees.
  const latency = Number(params.get('boot')) || 60;

  window.confirm = () => true;
  window.alert = m => console.log('[alert]', m);
</script>
<script src="public/js/app.js"></script>
</body>
</html>
